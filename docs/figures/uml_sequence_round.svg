ngth="26" x="540" y="559.1797">≥ 40]</text><line style="stroke: #000000; stroke-width: 1.0;" x1="521" x2="563" y1="605.3218" y2="605.3218"/><line style="stroke: #000000; stroke-width: 1.0;" x1="563" x2="563" y1="605.3218" y2="618.3218"/><line style="stroke: #000000; stroke-width: 1.0;" x1="522" x2="563" y1="618.3218" y2="618.3218"/><polygon fill="#000000" points="532,614.3218,522,618.3218,532,622.3218,528,618.3218" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="Liberation Serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="95" x="530" y="584.9272">advanceGeneration(</text><text fill="#000000" font-family="Liberation Serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="65" x="530" y="598.7261">state, lineage)</text><polygon fill="#000000" points="149.5,653.1206,139.5,657.1206,149.5,661.1206,145.5,657.1206" style="stroke: #000000; stroke-width: 1.0;"/><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="143.5" x2="515" y1="657.1206" y2="657.1206"/><text fill="#000000" font-family="Liberation Serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="83" x="157.5" y="650.5249">{pick, advanced}</text><polygon fill="#000000" points="215.5,684.9194,225.5,688.9194,215.5,692.9194,219.5,688.9194" style="stroke: #000000; stroke-width: 1.0;"/><line style="stroke: #000000; stroke-width: 1.0;" x1="138.5" x2="221.5" y1="688.9194" y2="688.9194"/><text fill="#000000" font-family="Liberation Serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="55" x="147.5" y="682.3237">saveLocal()</text><line style="stroke: #000000; stroke-width: 1.0;" x1="637" x2="627" y1="748.3159" y2="744.3159"/><line style="stroke: #000000; stroke-width: 1.0;" x1="637" x2="627" y1="748.3159" y2="752.3159"/><line style="stroke: #000000; stroke-width: 1.0;" x1="138.5" x2="638" y1="748.3159" y2="748.3159"/><text fill="#000000" font-family="Liberation Serif" font-size="12" lengthAdjust="spacingAndGlyphs" textL